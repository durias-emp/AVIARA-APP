<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Without this iOS draws its own opaque near-white (#fdfdfd) strip above
         the web view in standalone mode, which never matches --bg. translucent
         hands the status bar region to the page instead, so the body's
         safe-area padding paints it the same colour as everything below. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Browser/PWA chrome colour. Deliberately a single tag with no media
         query: iOS reads media-scoped theme-color tags when the app launches
         and does not re-evaluate them afterwards, so switching the system
         appearance left the status bar on the colour it started with until the
         app was killed and reopened. useTheme rewrites this one on every
         change instead. -->
    <meta name="theme-color" content="#f2f2f7" />
    <title>AVIARA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
