<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- default, not black-translucent, and the history matters. Translucent
         promises the page the whole screen, but this iOS ships a container
         bug: the view is sized screen-minus-status-bar yet pinned to the top,
         so a dead OS-owned band sits under the app that no CSS can reach
         (proven with painted probes; see main.jsx). default sizes the view
         below the bar down to the physical bottom: the band disappears and
         the bar area is painted by iOS, tinted via theme-color, which
         useTheme already keeps in sync with the app background. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Browser/PWA chrome colour. Deliberately a single tag with no media
         query: iOS reads media-scoped theme-color tags when the app launches
         and does not re-evaluate them afterwards, so switching the system
         appearance left the status bar on the colour it started with until the
         app was killed and reopened. useTheme rewrites this one on every
         change instead. -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Both schemes, declared before any script runs: iOS reads this when
         painting the standalone status bar. See the :root color-scheme note
         in index.css. -->
    <meta name="color-scheme" content="light dark" />
    <title>AVIARA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
